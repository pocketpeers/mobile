name: pocketpeers
description: Flutter frontend for PocketPeers operations backend.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  go_router: ^14.6.2
  image_picker: ^1.1.2
  fl_chart: ^0.69.2
  intl: ^0.20.1
  flutter_local_notifications: ^22.3.0
  image_cropper: ^12.2.1
  android_id: ^0.5.2+1
  pdfrx: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  pretty_dio_logger: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # Las subcarpetas no se incluyen solas: hay que declararlas aparte.
    - assets/images/crew/